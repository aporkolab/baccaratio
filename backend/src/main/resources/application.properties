spring.application.name=baccaratio

# H2 Database Configuration
# The H2 web console allows arbitrary SQL (and code execution) against the database,
# so it is disabled unless explicitly enabled for local development (H2_CONSOLE_ENABLED=true).
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Datasource Configuration
spring.datasource.url=jdbc:h2:mem:baccaratdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# JWT Configuration
# Base64 encoded key of at least 256 bits, e.g. `openssl rand -base64 32`.
# If JWT_SECRET is not set, a random key is generated at startup (tokens are invalidated on restart).
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:PT10H}

# CORS: default frontend origins; CORS_ORIGIN (comma separated) adds more
app.cors.allowed-origins=https://www.baccaratio.devma.de,https://baccaratio.devma.de,\
  http://www.baccaratio.devma.de,http://baccaratio.devma.de,\
  https://www.baccaratio.aporkolab.com,https://baccaratio.aporkolab.com,\
  http://www.baccaratio.aporkolab.com,http://baccaratio.aporkolab.com,\
  http://localhost:4200
app.cors.extra-origins=${CORS_ORIGIN:}

# Game Configuration
app.game.initial-chips=1000

# Actuator Configuration
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
